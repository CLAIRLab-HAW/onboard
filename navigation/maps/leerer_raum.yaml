# Synthetic empty room, 10.0 x 10.0 m.
# Generated with husky_navigation.make_map.write_empty_room -- do
# not edit by hand, generate it anew.
# origin puts the origin in the MIDDLE of the room, so that the
# robot stands centred on (0,0) at map start.
image: leerer_raum.pgm
mode: trinary
resolution: 0.05
origin: [-5.000, -5.000, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
