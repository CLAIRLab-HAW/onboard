# Nav2-Parameter des a200-0553.
#
# ALLES steht unter dem Namespace a200_0553 -- Parameter ausserhalb greifen
# nicht, die Knoten starten mit ihren Defaults, und niemand sagt es.
#
# Fuer Zahlen, die aus der Hardware kommen, ist /clearpath/platform/config/
# control.yaml die Quelle: max_velocity 1.0 (linear wie angular),
# max_acceleration 1.0.  Nav2 bleibt bewusst darunter -- ein Roboter, der
# schneller befiehlt als der Radcontroller zulaesst, plant Bahnen, die
# stillschweigend beschnitten werden.
a200_0553:
  bt_navigator:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      odom_topic: platform/odom/filtered
      bt_loop_duration: 10
      # MILLISEKUNDEN, nicht Sekunden -- 20 ist der Nav2-Default und hier zu
      # knapp.  Es ist die Frist, in der ein Action-Server den Eingang eines
      # Goals bestaetigen muss; verstreicht sie, bricht der Baum ab, obwohl
      # mit der Fahrt nichts verkehrt ist.
      #
      # Am 2026-08-22 im Mock beobachtet, und die Zeitstempel sagen alles:
      #   ...038.494  Received a goal, begin computing control effort.
      #   ...052.863  WARN  Timed out while waiting for action server to
      #                     acknowledge goal request for follow_path
      #   ...052.865  ERROR Goal failed
      #   ...053.145  INFO  Reached the goal!      <- 0,28 s SPAETER
      # Der Husky stand also am Ziel, nachdem der Baum ihn aufgegeben hatte.
      # Das Ergebnis meldet ABORTED bei einer Endabweichung von 0,226 m --
      # innerhalb der 0,25er Toleranz.  Wer nur den Status liest, sucht den
      # Fehler beim Regler.
      #
      # Es ist ein Rennen und tritt sporadisch auf: im Container laufen gut
      # drei Dutzend Knoten, und unter Last braucht die Bestaetigung laenger
      # als 20 ms.  200 ms sind immer noch weit unter jeder Frist, die einem
      # Menschen auffiele, und lassen dem Server Luft.
      default_server_timeout: 200

  controller_server:
    ros__parameters:
      controller_frequency: 20.0
      # Gilt PRO KNOTEN, genau wie enable_stamped_cmd_vel -- und genau wie
      # dort war er hier vergessen, waehrend er im bt_navigator richtig
      # stand.  Der Nav2-Default ist "odom"; im Namespace loest das zu
      # /a200_0553/odom auf, und darauf publiziert NIEMAND.
      #
      # Das laeuft ohne eine einzige Fehlermeldung ins Leere: der
      # controller_server bekommt seine Ist-Geschwindigkeit nie, `speed`
      # bleibt konstant 0, und jeder Regler, der darauf aufbaut, regelt
      # blind.  Am 2026-08-22 gemessen, und das Bild war eindeutig: der
      # RotationShimController beschleunigte in JEDEM Zyklus aufs Neue von
      # null aus und kam ueber einen einzigen Schritt nicht hinaus --
      # kommandiert wurden 0,05 rad/s statt der eingestellten 0,8
      # (max_angular_accel 1,0 x 0,05 s Zykluszeit = 0,05).  Der Husky drehte
      # sich also mit 2,9 Grad/s; eine 180-Grad-Wende haette 63 s gedauert.
      # Nach 10 s schlug der Fortschrittswaechter zu, brach ab, der Baum
      # plante neu -- und das Karussell begann von vorn.
      #
      # Aufgefallen ist es an einer Beobachtung am Bildschirm ("er dreht
      # sich, aber sehr langsam"), nicht an einer Fehlermeldung.  Deshalb
      # prueft `test_the_controller_actually_receives_odometry` seitdem, dass
      # auf dem eingestellten Topic auch wirklich jemand PUBLIZIERT -- die
      # blosse Existenz eines Topics beweist in ROS 2 gar nichts, ein
      # Abonnent allein laesst es in `topic list` erscheinen.
      #
      # platform/odom/filtered ist die EKF-Quelle.  Sie und nicht die rohe
      # platform/odom, weil der EKF auch die TF odom -> base_link liefert:
      # so kommen Pose und Geschwindigkeit aus derselben Quelle.
      odom_topic: platform/odom/filtered
      # twist_mux (use_stamped: True), DiffDriveController (use_stamped_vel:
      # True) und das robot-contract-Profil (cmd_vel_stamped: true) stehen
      # alle auf TwistStamped.  Nav2s Jazzy-Default ist Twist -- beim
      # falschen Typ bindet die Subscription NICHT, und der Roboter steht
      # ohne Fehlermeldung.
      enable_stamped_cmd_vel: true
      min_x_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["goal_checker"]
      controller_plugins: ["FollowPath"]
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0
      goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        # Die Zielorientierung wird ABSICHTLICH nicht erzwungen (3.15 > pi
        # deckt jeden Winkel ab).  Zwei Gruende, beide gemessen:
        #
        # 1. RegulatedPurePursuit ist ein reiner POSITIONSfolger und dreht am
        #    Ziel nicht nach -- der Regler kennt dafuer nicht einmal einen
        #    Parameter (am 2026-08-22 am laufenden controller_server
        #    abgefragt: es gibt `use_rotate_to_heading` und
        #    `rotate_to_heading_min_angle` fuer die Pfadverfolgung, keinen
        #    einzigen fuer die Zielpose).  Mit einer engen Toleranz stand der
        #    Husky auf der Zielposition, 155 Grad verdreht, und kam nie
        #    hinein: gemessen Ziel-Yaw 0, End-Yaw -2,709 rad bei einer
        #    Positionsabweichung von nur 0,237 m.  Das Goal lief bis zum
        #    Timeout, und der Fortschrittswaechter loeste im 10-Sekunden-Takt
        #    Recoveries aus, die den Roboter zufaellig weiterdrehten, bis es
        #    zufaellig passte -- 12 Recoveries und 121 s fuer 2 m.
        #
        # 2. Selbst wenn der Regler es koennte, waere die Zahl in diesem Stand
        #    nicht belastbar: solange R34 offen ist, gibt es keine Scans, die
        #    Lokalisierung steht allein auf Radodometrie, und der
        #    Skid-Steer-Faktor ist am echten Roboter ungemessen (R37).  Eine
        #    14-Grad-Endtoleranz nach mehreren Metern Fahrt vorzugeben hiesse,
        #    eine Genauigkeit zu behaupten, die die Sensorik nicht hergibt.
        #
        # Braucht ein Greifvorgang spaeter eine ausgerichtete Endpose, gehoert
        # sie als eigener Schritt MIT Sensorbezug dazu -- nicht als Toleranz
        # auf einer Odometrie, die driftet.
        yaw_goal_tolerance: 3.15
        stateful: true
      FollowPath:
        # Der Shim dreht den Husky VOR dem Losfahren auf die Pfadrichtung ein
        # und uebergibt dann an RPP.  Genau das kann ein Skid-Steer gut, und
        # genau das fehlte: bei einem Ziel, das eine grosse Richtungsaenderung
        # verlangte, kam der Roboter nicht weg -- am 2026-08-22 gemessen, Ziel
        # (-2|2) aus (1,93|1,78): nach 51 s ganze 0,06 m gefahren, dann
        # ABORTED.  Ein Ziel geradeaus lief in derselben Runde in 12 s durch.
        #
        # Der Shim ist ein Wrapper: `primary_controller` uebernimmt, sobald
        # der Winkel unter `angular_dist_threshold` liegt, und liest seine
        # Parameter aus DIESEM Block -- die RPP-Zeilen darunter bleiben
        # deshalb unveraendert stehen, wo sie sind.
        plugin: "nav2_rotation_shim_controller::RotationShimController"
        primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        angular_dist_threshold: 0.785
        forward_sampling_distance: 0.5
        # 0.8 rad/s, NICHT der Nav2-Default 1.8: der
        # platform_velocity_controller klemmt angular.z bei 1.0, und
        # max_acceleration ebenfalls bei 1.0 (s. /clearpath/platform/config/
        # control.yaml).  Ein Shim, der mehr kommandiert, als der Antrieb
        # ausfuehren kann, laesst den Roboter hinter seinem eigenen Sollwert
        # herlaufen -- und der Fortschrittswaechter sieht davon nur, dass
        # nichts vorangeht.
        rotate_to_heading_angular_vel: 0.8
        max_angular_accel: 1.0
        simulate_ahead_time: 1.0
        # --- ab hier der primary_controller (RPP), unveraendert ---
        desired_linear_vel: 0.4
        max_vel_x: 0.5              # Radcontroller klemmt bei 1.0
        max_vel_theta: 0.8          # Radcontroller klemmt bei 1.0
        lookahead_dist: 0.6
        min_lookahead_dist: 0.3
        max_lookahead_dist: 0.9
        use_velocity_scaled_lookahead_dist: true
        # Der Husky ist ein Skid-Steer (vier angetriebene Raeder, keine
        # Lenkung) und kann auf der Stelle drehen -- ohne diesen Schalter
        # faehrt er Bogen, wo er sich drehen koennte.
        use_rotate_to_heading: true
        transform_tolerance: 0.2

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: odom
        robot_base_frame: base_link
        rolling_window: true
        width: 6
        height: 6
        resolution: 0.05
        # Der Husky misst 0,99 x 0,67 m.  0,60 m umschliesst ihn samt Arm in
        # Fahrstellung -- ein kleinerer Radius liesse Nav2 Pfade planen, in
        # die der Roboter nicht passt.  R15 (Sensorbuegel und Frontstossfaenger
        # fehlen im Kollisionsmodell) ist ein zusaetzlicher Grund, hier nicht
        # knapp zu rechnen.
        robot_radius: 0.60
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /a200_0553/sensors/lidar3d_0/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
            raytrace_max_range: 30.0
            raytrace_min_range: 0.0
            obstacle_max_range: 25.0
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.70

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: base_link
        robot_radius: 0.60
        resolution: 0.05
        track_unknown_space: true
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: true
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /a200_0553/sensors/lidar3d_0/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
            raytrace_max_range: 30.0
            raytrace_min_range: 0.0
            obstacle_max_range: 25.0
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.70

  planner_server:
    ros__parameters:
      expected_planner_frequency: 20.0
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"
        tolerance: 0.5
        use_astar: false
        allow_unknown: true

  behavior_server:
    ros__parameters:
      local_frame: odom
      global_frame: map
      robot_base_frame: base_link
      # Gilt PRO KNOTEN -- ihn nur beim controller_server zu setzen genuegt
      # nicht.  Ohne ihn publizieren spin und backup geometry_msgs/Twist,
      # waehrend twist_mux ausschliesslich TwistStamped abonniert: die
      # Recovery-Kommandos kommen dann NIE an der Basis an, und der Roboter
      # bleibt in der Sackgasse stehen, statt sich freizufahren.
      #
      # Am 2026-08-22 im Mock gemessen -- /a200_0553/cmd_vel trug beide Typen:
      # controller_server -> TwistStamped, behavior_server -> Twist (3 Publisher,
      # einer je Verhalten).  Kein Test hatte das gefunden: ohne Lidar hat die
      # Costmap keine Hindernisse, also loest nie ein Recovery aus.  Gemeldet
      # hat es Foxglove ("Multiple channels advertise the same topic ... but
      # the schema ... do not match") -- die Warnung war echt, kein Anzeigefehler.
      enable_stamped_cmd_vel: true
      behavior_plugins: ["spin", "backup", "wait"]
      spin:
        plugin: "nav2_behaviors::Spin"
      backup:
        plugin: "nav2_behaviors::BackUp"
      wait:
        plugin: "nav2_behaviors::Wait"
      max_rotational_vel: 0.8
      min_rotational_vel: 0.2
      rotational_acc_lim: 1.0

  map_server:
    ros__parameters:
      yaml_filename: "leerer_raum.yaml"

  amcl:
    ros__parameters:
      # AMCL laeuft erst mit, wenn der Sensorpfad Scans liefert (Task 9).
      # Bis dahin uebernimmt ein static_transform_publisher die Kante
      # map -> odom: ein AMCL ohne Scans publiziert GAR KEINE Transformation,
      # und die TF-Kette staende still.
      base_frame_id: base_link
      odom_frame_id: odom
      global_frame_id: map
      scan_topic: /a200_0553/sensors/lidar3d_0/scan
      robot_model_type: "nav2_amcl::DifferentialMotionModel"
      laser_model_type: "likelihood_field"
      min_particles: 500
      max_particles: 2000
      update_min_d: 0.25
      update_min_a: 0.2
      laser_max_range: 25.0
      laser_min_range: 0.2
      set_initial_pose: true
      initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
