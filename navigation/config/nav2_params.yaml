# Nav2 parameters of the a200-0553.
#
# EVERYTHING sits under the namespace a200_0553 -- parameters outside it do
# not take effect, the nodes start with their defaults, and nobody says so.
#
# For numbers that come from the hardware, /clearpath/platform/config/
# control.yaml is the source: max_velocity 1.0 (linear as well as angular),
# max_acceleration 1.0.  Nav2 deliberately stays below that -- a robot that
# commands faster than the wheel controller allows plans trajectories that
# get silently trimmed.
a200_0553:
  bt_navigator:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      odom_topic: platform/odom/filtered
      bt_loop_duration: 10
      # MILLISECONDS, not seconds -- 20 is the Nav2 default and too tight
      # here.  It is the deadline within which an action server has to
      # acknowledge the arrival of a goal; if it elapses, the tree aborts
      # although there is nothing wrong with the drive.
      #
      # Observed in the mock on 2026-08-22, and the timestamps say it all:
      #   ...038.494  Received a goal, begin computing control effort.
      #   ...052.863  WARN  Timed out while waiting for action server to
      #                     acknowledge goal request for follow_path
      #   ...052.865  ERROR Goal failed
      #   ...053.145  INFO  Reached the goal!      <- 0,28 s LATER
      # So the Husky stood at the goal after the tree had given up on it.
      # The result reports ABORTED at a final deviation of 0,226 m -- inside
      # the 0,25 tolerance.  Whoever reads only the status looks for the
      # fault in the controller.
      #
      # It is a race and occurs sporadically: a good three dozen nodes run in
      # the container, and under load the acknowledgement takes longer than
      # 20 ms.  200 ms is still far below any deadline a human would notice,
      # and gives the server room.
      default_server_timeout: 200

  controller_server:
    ros__parameters:
      controller_frequency: 20.0
      # Applies PER NODE, exactly like enable_stamped_cmd_vel -- and exactly
      # as there, it was forgotten here while it stood correctly in the
      # bt_navigator.  The Nav2 default is "odom"; inside the namespace that
      # resolves to /a200_0553/odom, and NOBODY publishes on it.
      #
      # This runs into the void without a single error message: the
      # controller_server never gets its actual velocity, `speed` stays
      # constantly 0, and every controller built on it controls blind.
      # Measured on 2026-08-22, and the picture was unambiguous: the
      # RotationShimController accelerated from zero anew in EVERY cycle and
      # never got past a single step -- 0,05 rad/s was commanded instead of
      # the configured 0,8 (max_angular_accel 1,0 x 0,05 s cycle time =
      # 0,05).  So the Husky turned at 2,9 degrees/s; a 180 degree turn would
      # have taken 63 s.  After 10 s the progress checker struck, aborted,
      # the tree replanned -- and the merry-go-round started over.
      #
      # It was noticed through an observation on the screen ("it turns, but
      # very slowly"), not through an error message.  That is why
      # `test_the_controller_actually_receives_odometry` has since checked
      # that somebody really does PUBLISH on the configured topic -- in ROS 2
      # the mere existence of a topic proves nothing at all, a subscriber
      # alone makes it appear in `topic list`.
      #
      # platform/odom/filtered is the EKF source.  That one and not the raw
      # platform/odom, because the EKF also supplies the TF odom -> base_link:
      # this way pose and velocity come from the same source.
      odom_topic: platform/odom/filtered
      # twist_mux (use_stamped: True), DiffDriveController (use_stamped_vel:
      # True) and the robot-contract profile (cmd_vel_stamped: true) are all
      # on TwistStamped.  Nav2's Jazzy default is Twist -- with the wrong
      # type the subscription does NOT bind, and the robot stands still
      # without an error message.
      enable_stamped_cmd_vel: true
      min_x_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["goal_checker"]
      controller_plugins: ["FollowPath"]
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0
      goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        # The goal orientation is DELIBERATELY not enforced (3.15 > pi covers
        # every angle).  Two reasons, both measured:
        #
        # 1. RegulatedPurePursuit is a pure POSITION follower and does not
        #    turn into place at the goal -- the controller does not even have
        #    a parameter for it (queried on the running controller_server on
        #    2026-08-22: there is `use_rotate_to_heading` and
        #    `rotate_to_heading_min_angle` for path following, not a single
        #    one for the goal pose).  With a tight tolerance the Husky stood
        #    on the goal position, twisted by 155 degrees, and never got
        #    inside it: measured goal yaw 0, final yaw -2,709 rad at a
        #    position deviation of only 0,237 m.  The goal ran until the
        #    timeout, and the progress checker triggered recoveries every 10
        #    seconds that turned the robot on at random until it happened to
        #    fit -- 12 recoveries and 121 s for 2 m.
        #
        # 2. Even if the controller could do it, the number would not be
        #    dependable in this state: as long as R34 is open there are no
        #    scans, localization rests on wheel odometry alone, and the
        #    skid-steer factor is unmeasured on the real robot (R37).
        #    Prescribing a 14 degree final tolerance after several metres of
        #    driving would mean claiming an accuracy the sensors do not
        #    deliver.
        #
        # If a grasping operation later needs an aligned final pose, that
        # belongs in as a step of its own WITH a sensor reference -- not as a
        # tolerance on an odometry that drifts.
        yaw_goal_tolerance: 3.15
        stateful: true
      FollowPath:
        # The shim turns the Husky onto the path direction BEFORE driving off
        # and then hands over to RPP.  That is exactly what a skid-steer is
        # good at, and exactly what was missing: with a goal that demanded a
        # large change of direction the robot did not get away -- measured on
        # 2026-08-22, goal (-2|2) from (1,93|1,78): all of 0,06 m travelled
        # after 51 s, then ABORTED.  A goal straight ahead went through in
        # 12 s in the same round.
        #
        # The shim is a wrapper: `primary_controller` takes over as soon as
        # the angle falls below `angular_dist_threshold`, and reads its
        # parameters from THIS block -- the RPP lines underneath therefore
        # stay unchanged where they are.
        plugin: "nav2_rotation_shim_controller::RotationShimController"
        primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        angular_dist_threshold: 0.785
        forward_sampling_distance: 0.5
        # 0.8 rad/s, NOT the Nav2 default 1.8: the
        # platform_velocity_controller clamps angular.z at 1.0, and
        # max_acceleration likewise at 1.0 (see /clearpath/platform/config/
        # control.yaml).  A shim that commands more than the drive can
        # execute leaves the robot trailing its own setpoint -- and all the
        # progress checker sees of that is that nothing is moving.
        rotate_to_heading_angular_vel: 0.8
        max_angular_accel: 1.0
        simulate_ahead_time: 1.0
        # --- from here on the primary_controller (RPP), unchanged ---
        desired_linear_vel: 0.4
        max_vel_x: 0.5              # the wheel controller clamps at 1.0
        max_vel_theta: 0.8          # the wheel controller clamps at 1.0
        lookahead_dist: 0.6
        min_lookahead_dist: 0.3
        max_lookahead_dist: 0.9
        use_velocity_scaled_lookahead_dist: true
        # The Husky is a skid-steer (four driven wheels, no steering) and can
        # turn on the spot -- without this switch it drives arcs where it
        # could turn.
        use_rotate_to_heading: true
        transform_tolerance: 0.2

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: odom
        robot_base_frame: base_link
        rolling_window: true
        width: 6
        height: 6
        resolution: 0.05
        # The Husky measures 0,99 x 0,67 m.  0,60 m encloses it including the
        # arm in driving posture -- a smaller radius would let Nav2 plan paths
        # the robot does not fit through.  R15 (sensor bracket and front
        # bumper are missing from the collision model) is an additional reason
        # not to reckon tightly here.
        robot_radius: 0.60
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /a200_0553/sensors/lidar3d_0/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
            raytrace_max_range: 30.0
            raytrace_min_range: 0.0
            obstacle_max_range: 25.0
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.70

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: base_link
        robot_radius: 0.60
        resolution: 0.05
        track_unknown_space: true
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: true
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /a200_0553/sensors/lidar3d_0/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
            raytrace_max_range: 30.0
            raytrace_min_range: 0.0
            obstacle_max_range: 25.0
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.70

  planner_server:
    ros__parameters:
      expected_planner_frequency: 20.0
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"
        tolerance: 0.5
        use_astar: false
        allow_unknown: true

  behavior_server:
    ros__parameters:
      local_frame: odom
      global_frame: map
      robot_base_frame: base_link
      # Applies PER NODE -- setting it only on the controller_server is not
      # enough.  Without it spin and backup publish geometry_msgs/Twist while
      # twist_mux subscribes exclusively to TwistStamped: the recovery
      # commands then NEVER arrive at the base, and the robot stays stuck in
      # the dead end instead of freeing itself.
      #
      # Measured in the mock on 2026-08-22 -- /a200_0553/cmd_vel carried both
      # types: controller_server -> TwistStamped, behavior_server -> Twist
      # (3 publishers, one per behaviour).  No test had found it: without a
      # lidar the costmap has no obstacles, so a recovery never triggers.
      # Foxglove reported it ("Multiple channels advertise the same topic ...
      # but the schema ... do not match") -- the warning was real, not a
      # display glitch.
      enable_stamped_cmd_vel: true
      behavior_plugins: ["spin", "backup", "wait"]
      spin:
        plugin: "nav2_behaviors::Spin"
      backup:
        plugin: "nav2_behaviors::BackUp"
      wait:
        plugin: "nav2_behaviors::Wait"
      max_rotational_vel: 0.8
      min_rotational_vel: 0.2
      rotational_acc_lim: 1.0

  map_server:
    ros__parameters:
      yaml_filename: "leerer_raum.yaml"

  amcl:
    ros__parameters:
      # AMCL only comes along once the sensor path delivers scans (task 9).
      # Until then a static_transform_publisher takes over the edge
      # map -> odom: an AMCL without scans publishes NO transform at all, and
      # the TF chain would stand still.
      base_frame_id: base_link
      odom_frame_id: odom
      global_frame_id: map
      scan_topic: /a200_0553/sensors/lidar3d_0/scan
      robot_model_type: "nav2_amcl::DifferentialMotionModel"
      laser_model_type: "likelihood_field"
      min_particles: 500
      max_particles: 2000
      update_min_d: 0.25
      update_min_a: 0.2
      laser_max_range: 25.0
      laser_min_range: 0.2
      set_initial_pose: true
      initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
