# Nav2 parameters of the a200-0553.
#
# EVERYTHING sits under the namespace a200_0553 -- parameters outside it do
# not take effect, the nodes start with their defaults, and nobody says so.
#
# For numbers that come from the hardware, /clearpath/platform/config/
# control.yaml is the source: max_velocity 1.0 (linear as well as angular),
# max_acceleration 1.0.  Nav2 deliberately stays below that -- a robot that
# commands faster than the wheel controller allows plans trajectories that
# get silently trimmed.
a200_0553:
  bt_navigator:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      odom_topic: platform/odom/filtered
      bt_loop_duration: 10
      # MILLISECONDS, not seconds -- 20 is the Nav2 default and too tight
      # here.  It is the deadline within which an action server has to
      # acknowledge the arrival of a goal; if it elapses, the tree aborts
      # although there is nothing wrong with the drive.
      #
      # Observed in the mock on 2026-08-22, and the timestamps say it all:
      #   ...038.494  Received a goal, begin computing control effort.
      #   ...052.863  WARN  Timed out while waiting for action server to
      #                     acknowledge goal request for follow_path
      #   ...052.865  ERROR Goal failed
      #   ...053.145  INFO  Reached the goal!      <- 0,28 s LATER
      # So the Husky stood at the goal after the tree had given up on it.
      # The result reports ABORTED at a final deviation of 0,226 m -- inside
      # the 0,25 tolerance.  Whoever reads only the status looks for the
      # fault in the controller.
      #
      # It is a race and occurs sporadically: a good three dozen nodes run in
      # the container, and under load the acknowledgement takes longer than
      # 20 ms.  200 ms is still far below any deadline a human would notice,
      # and gives the server room.
      default_server_timeout: 200

  controller_server:
    ros__parameters:
      controller_frequency: 20.0
      # Applies PER NODE, exactly like enable_stamped_cmd_vel -- and exactly
      # as there, it was forgotten here while it stood correctly in the
      # bt_navigator.  The Nav2 default is "odom"; inside the namespace that
      # resolves to /a200_0553/odom, and NOBODY publishes on it.
      #
      # This runs into the void without a single error message: the
      # controller_server never gets its actual velocity, `speed` stays
      # constantly 0, and every controller built on it controls blind.
      # Measured on 2026-08-22, and the picture was unambiguous: the
      # RotationShimController accelerated from zero anew in EVERY cycle and
      # never got past a single step -- 0,05 rad/s was commanded instead of
      # the configured 0,8 (max_angular_accel 1,0 x 0,05 s cycle time =
      # 0,05).  So the Husky turned at 2,9 degrees/s; a 180 degree turn would
      # have taken 63 s.  After 10 s the progress checker struck, aborted,
      # the tree replanned -- and the merry-go-round started over.
      #
      # It was noticed through an observation on the screen ("it turns, but
      # very slowly"), not through an error message.  That is why
      # `test_the_controller_actually_receives_odometry` has since checked
      # that somebody really does PUBLISH on the configured topic -- in ROS 2
      # the mere existence of a topic proves nothing at all, a subscriber
      # alone makes it appear in `topic list`.
      #
      # platform/odom/filtered is the EKF source.  That one and not the raw
      # platform/odom, because the EKF also supplies the TF odom -> base_link:
      # this way pose and velocity come from the same source.
      odom_topic: platform/odom/filtered
      # twist_mux (use_stamped: True), DiffDriveController (use_stamped_vel:
      # True) and the robot-contract profile (cmd_vel_stamped: true) are all
      # on TwistStamped.  Nav2's Jazzy default is Twist -- with the wrong
      # type the subscription does NOT bind, and the robot stands still
      # without an error message.
      enable_stamped_cmd_vel: true
      min_x_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["goal_checker"]
      controller_plugins: ["FollowPath"]
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0
      goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        # The goal orientation is DELIBERATELY not enforced (3.15 > pi covers
        # every angle).  Two reasons, both measured:
        #
        # 1. RegulatedPurePursuit is a pure POSITION follower and does not
        #    turn into place at the goal -- the controller does not even have
        #    a parameter for it (queried on the running controller_server on
        #    2026-08-22: there is `use_rotate_to_heading` and
        #    `rotate_to_heading_min_angle` for path following, not a single
        #    one for the goal pose).  With a tight tolerance the Husky stood
        #    on the goal position, twisted by 155 degrees, and never got
        #    inside it: measured goal yaw 0, final yaw -2,709 rad at a
        #    position deviation of only 0,237 m.  The goal ran until the
        #    timeout, and the progress checker triggered recoveries every 10
        #    seconds that turned the robot on at random until it happened to
        #    fit -- 12 recoveries and 121 s for 2 m.
        #
        # 2. Even if the controller could do it, the number would not be
        #    dependable in this state: as long as R34 is open there are no
        #    scans, localization rests on wheel odometry alone, and the
        #    skid-steer factor is unmeasured on the real robot (R37).
        #    Prescribing a 14 degree final tolerance after several metres of
        #    driving would mean claiming an accuracy the sensors do not
        #    deliver.
        #
        # If a grasping operation later needs an aligned final pose, that
        # belongs in as a step of its own WITH a sensor reference -- not as a
        # tolerance on an odometry that drifts.
        yaw_goal_tolerance: 3.15
        stateful: true
      FollowPath:
        # Regulated Pure Pursuit on its own, forward and backward.  The a200 is a skid steer that does not turn on the
        # spot -- that drags all four tires sideways, wears them and throws the wheel odometry's heading off -- and a
        # narrow corridor it cannot turn in, it leaves backward.  The planner below hands it paths it can drive that
        # way: arcs no tighter than its minimum turning radius, reversing segments where forward does not fit; RPP
        # drives a cusp in the path as a change of direction.  A grid path that demanded a large change of direction
        # left the Husky standing unless it turned on the spot first (2026-08-22: 0,06 m in 51 s, ABORTED); a path
        # from the kinematic planner demands none.
        plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        desired_linear_vel: 0.4
        max_vel_x: 0.5              # the wheel controller clamps at 1.0
        max_vel_theta: 0.8          # the wheel controller clamps at 1.0
        lookahead_dist: 0.6
        min_lookahead_dist: 0.3
        max_lookahead_dist: 0.9
        use_velocity_scaled_lookahead_dist: true
        allow_reversing: true
        # Off, and it has to be: RPP refuses it together with allow_reversing, and it is a turn on the spot.
        use_rotate_to_heading: false
        transform_tolerance: 0.2

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: odom
        robot_base_frame: base_link
        rolling_window: true
        width: 6
        height: 6
        resolution: 0.05
        # The Husky measures 0,99 x 0,67 m, the arm packed inside that outline -- the pose the robot starts and
        # drives in.  Its rectangle, 5 cm around it (R15: the sensor bracket and the front bumper are missing from
        # the collision model).  Not a circle around all of it: 0,60 m puts every cell within 0,60 m of a table leg
        # in inscribed cost -- in ArchitecTHOR's dining corner the robot stood in its own, and no plan left it
        # (2026-09-27).
        # An arm reaching out stands beyond this outline -- pack it before driving.
        footprint: "[[0.55, 0.39], [0.55, -0.39], [-0.55, -0.39], [-0.55, 0.39]]"
        plugins: ["obstacle_layer", "inflation_layer"]
        # A spatio-temporal voxel layer (STVL): 3D, so the RS16's points mark a tabletop the scan's height band passes
        # under, and every mark decays unless the lidar sees it again.  The voxel layer kept a mark until a ray passed
        # through it, which the RS16's 16 rings seldom do: after some driving the global costmap was 0.8 % free, 20 %
        # lethal and 55 % inscribed on the ManiSkill stack, and a clicked goal in the open corridor came back "Goal
        # was in lethal cost" at every heading (2026-09-27).  Here, near the robot, a mark lasts 10 s out of view.
        obstacle_layer:
          plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
          enabled: true
          voxel_decay: 10.0
          decay_model: 0  # linear
          voxel_size: 0.05
          track_unknown_space: true
          mark_threshold: 0
          update_footprint_enabled: true
          combination_method: 1  # max with the layers below
          origin_z: 0.0
          publish_voxel_map: false
          transform_tolerance: 0.2
          mapping_mode: false
          map_save_duration: 60.0
          observation_sources: points_mark points_clear
          # The RS16's points themselves, from just above the floor to above the arm and the arch: what the robot
          # would run into at any height.  Its own body stands inside the footprint, which the layer clears.
          points_mark:
            data_type: PointCloud2
            topic: /a200_0553/sensors/lidar3d_0/points
            marking: true
            clearing: false
            obstacle_range: 8.0
            min_obstacle_height: 0.05
            max_obstacle_height: 1.6
            expected_update_rate: 0.0
            observation_persistence: 0.0
            inf_is_valid: false
            filter: "voxel"
            voxel_min_points: 0
            clear_after_reading: true
          # The RS16's frustum, which clears: 360 degrees around, its rings from -15 to +15 degrees (the half angle is
          # what vertical_fov_angle takes for a lidar), from its 0.2 m blind zone to 10 m.
          points_clear:
            enabled: true
            data_type: PointCloud2
            topic: /a200_0553/sensors/lidar3d_0/points
            marking: false
            clearing: true
            min_z: 0.2
            max_z: 10.0
            vertical_fov_angle: 0.5236
            vertical_fov_padding: 0.05
            horizontal_fov_angle: 6.29
            decay_acceleration: 5.0
            model_type: 1  # 3D lidar
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.70

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: base_link
        footprint: "[[0.55, 0.39], [0.55, -0.39], [-0.55, -0.39], [-0.55, 0.39]]"  # as the local costmap's
        resolution: 0.05
        track_unknown_space: true
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: true
        # A spatio-temporal voxel layer (STVL): 3D, so the RS16's points mark a tabletop the scan's height band passes
        # under, and every mark decays unless the lidar sees it again.  The voxel layer kept a mark until a ray passed
        # through it, which the RS16's 16 rings seldom do: after some driving the global costmap was 0.8 % free, 20 %
        # lethal and 55 % inscribed on the ManiSkill stack, and a clicked goal in the open corridor came back "Goal
        # was in lethal cost" at every heading (2026-09-27).  In the global costmap 15 s: walls stay in the slam map
        # below.
        obstacle_layer:
          plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
          enabled: true
          voxel_decay: 15.0
          decay_model: 0  # linear
          voxel_size: 0.05
          track_unknown_space: true
          mark_threshold: 0
          update_footprint_enabled: true
          combination_method: 1  # max with the layers below
          origin_z: 0.0
          publish_voxel_map: false
          transform_tolerance: 0.2
          mapping_mode: false
          map_save_duration: 60.0
          observation_sources: points_mark points_clear
          # The RS16's points themselves, from just above the floor to above the arm and the arch: what the robot
          # would run into at any height.  Its own body stands inside the footprint, which the layer clears.
          points_mark:
            data_type: PointCloud2
            topic: /a200_0553/sensors/lidar3d_0/points
            marking: true
            clearing: false
            obstacle_range: 8.0
            min_obstacle_height: 0.05
            max_obstacle_height: 1.6
            expected_update_rate: 0.0
            observation_persistence: 0.0
            inf_is_valid: false
            filter: "voxel"
            voxel_min_points: 0
            clear_after_reading: true
          # The RS16's frustum, which clears: 360 degrees around, its rings from -15 to +15 degrees (the half angle is
          # what vertical_fov_angle takes for a lidar), from its 0.2 m blind zone to 10 m.
          points_clear:
            enabled: true
            data_type: PointCloud2
            topic: /a200_0553/sensors/lidar3d_0/points
            marking: false
            clearing: true
            min_z: 0.2
            max_z: 10.0
            vertical_fov_angle: 0.5236
            vertical_fov_padding: 0.05
            horizontal_fov_angle: 6.29
            decay_acceleration: 5.0
            model_type: 1  # 3D lidar
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.70

  planner_server:
    ros__parameters:
      expected_planner_frequency: 20.0
      planner_plugins: ["GridBased"]
      # Smac Hybrid-A* with Reeds-Shepp motion: paths the skid steer drives without turning on the spot -- arcs of
      # at least minimum_turning_radius, forward and backward (FollowPath says why).  The id stays GridBased, which
      # the behavior trees name.  It checks the footprint, not a circle, along the whole path.
      GridBased:
        plugin: "nav2_smac_planner::SmacPlannerHybrid"
        motion_model_for_search: "REEDS_SHEPP"
        # 0,5 m: the tightest arc RPP drives at its desired 0,4 m/s within max_vel_theta 0,8 rad/s.
        minimum_turning_radius: 0.5
        # Backward only where forward does not fit, and no dithering between the two.
        reverse_penalty: 2.0
        change_penalty: 0.5
        # 0: a goal in an obstacle is refused.  With 0,5 NavFn planned to the nearest free cell instead -- a goal
        # under a dining table ended at the start, the base never moved, and the navigator reported the goal as
        # reached (2026-09-27, ManiSkill with the RS16).
        tolerance: 0.0
        allow_unknown: true
        max_planning_time: 5.0
        angle_quantization_bins: 72
        smooth_path: true

  behavior_server:
    ros__parameters:
      local_frame: odom
      global_frame: map
      robot_base_frame: base_link
      # Applies PER NODE -- setting it only on the controller_server is not
      # enough.  Without it spin and backup publish geometry_msgs/Twist while
      # twist_mux subscribes exclusively to TwistStamped: the recovery
      # commands then NEVER arrive at the base, and the robot stays stuck in
      # the dead end instead of freeing itself.
      #
      # Measured in the mock on 2026-08-22 -- /a200_0553/cmd_vel carried both
      # types: controller_server -> TwistStamped, behavior_server -> Twist
      # (3 publishers, one per behaviour).  No test had found it: without a
      # lidar the costmap has no obstacles, so a recovery never triggers.
      # Foxglove reported it ("Multiple channels advertise the same topic ...
      # but the schema ... do not match") -- the warning was real, not a
      # display glitch.
      enable_stamped_cmd_vel: true
      behavior_plugins: ["spin", "backup", "wait"]
      spin:
        plugin: "nav2_behaviors::Spin"
      backup:
        plugin: "nav2_behaviors::BackUp"
      wait:
        plugin: "nav2_behaviors::Wait"
      max_rotational_vel: 0.8
      min_rotational_vel: 0.2
      rotational_acc_lim: 1.0

  map_server:
    ros__parameters:
      yaml_filename: "leerer_raum.yaml"

  amcl:
    ros__parameters:
      # AMCL only comes along once the sensor path delivers scans (task 9).
      # Until then a static_transform_publisher takes over the edge
      # map -> odom: an AMCL without scans publishes NO transform at all, and
      # the TF chain would stand still.
      base_frame_id: base_link
      odom_frame_id: odom
      global_frame_id: map
      scan_topic: /a200_0553/sensors/lidar3d_0/scan
      robot_model_type: "nav2_amcl::DifferentialMotionModel"
      laser_model_type: "likelihood_field"
      min_particles: 500
      max_particles: 2000
      update_min_d: 0.25
      update_min_a: 0.2
      laser_max_range: 25.0
      laser_min_range: 0.2
      set_initial_pose: true
      initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
