# Nav2-Parameter des a200-0553.
#
# ALLES steht unter dem Namespace a200_0553 -- Parameter ausserhalb greifen
# nicht, die Knoten starten mit ihren Defaults, und niemand sagt es.
#
# Fuer Zahlen, die aus der Hardware kommen, ist /clearpath/platform/config/
# control.yaml die Quelle: max_velocity 1.0 (linear wie angular),
# max_acceleration 1.0.  Nav2 bleibt bewusst darunter -- ein Roboter, der
# schneller befiehlt als der Radcontroller zulaesst, plant Bahnen, die
# stillschweigend beschnitten werden.
a200_0553:
  bt_navigator:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      odom_topic: platform/odom
      bt_loop_duration: 10
      default_server_timeout: 20

  controller_server:
    ros__parameters:
      controller_frequency: 20.0
      # twist_mux (use_stamped: True), DiffDriveController (use_stamped_vel:
      # True) und das robot-contract-Profil (cmd_vel_stamped: true) stehen
      # alle auf TwistStamped.  Nav2s Jazzy-Default ist Twist -- beim
      # falschen Typ bindet die Subscription NICHT, und der Roboter steht
      # ohne Fehlermeldung.
      enable_stamped_cmd_vel: true
      min_x_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["goal_checker"]
      controller_plugins: ["FollowPath"]
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0
      goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        yaw_goal_tolerance: 0.25
        stateful: true
      FollowPath:
        plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        desired_linear_vel: 0.4
        max_vel_x: 0.5              # Radcontroller klemmt bei 1.0
        max_vel_theta: 0.8          # Radcontroller klemmt bei 1.0
        lookahead_dist: 0.6
        min_lookahead_dist: 0.3
        max_lookahead_dist: 0.9
        use_velocity_scaled_lookahead_dist: true
        # Der Husky ist ein Differentialantrieb und kann auf der Stelle
        # drehen -- ohne diesen Schalter faehrt er Bogen, wo er sich drehen
        # koennte.
        use_rotate_to_heading: true
        rotate_to_heading_angular_vel: 0.6
        max_angular_accel: 1.0
        transform_tolerance: 0.2

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: odom
        robot_base_frame: base_link
        rolling_window: true
        width: 6
        height: 6
        resolution: 0.05
        # Der Husky misst 0,99 x 0,67 m.  0,60 m umschliesst ihn samt Arm in
        # Fahrstellung -- ein kleinerer Radius liesse Nav2 Pfade planen, in
        # die der Roboter nicht passt.  R15 (Sensorbuegel und Frontstossfaenger
        # fehlen im Kollisionsmodell) ist ein zusaetzlicher Grund, hier nicht
        # knapp zu rechnen.
        robot_radius: 0.60
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /a200_0553/sensors/lidar3d_0/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
            raytrace_max_range: 30.0
            raytrace_min_range: 0.0
            obstacle_max_range: 25.0
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.70

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: base_link
        robot_radius: 0.60
        resolution: 0.05
        track_unknown_space: true
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: true
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /a200_0553/sensors/lidar3d_0/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
            raytrace_max_range: 30.0
            raytrace_min_range: 0.0
            obstacle_max_range: 25.0
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.70

  planner_server:
    ros__parameters:
      expected_planner_frequency: 20.0
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"
        tolerance: 0.5
        use_astar: false
        allow_unknown: true

  behavior_server:
    ros__parameters:
      local_frame: odom
      global_frame: map
      robot_base_frame: base_link
      # Gilt PRO KNOTEN -- ihn nur beim controller_server zu setzen genuegt
      # nicht.  Ohne ihn publizieren spin und backup geometry_msgs/Twist,
      # waehrend twist_mux ausschliesslich TwistStamped abonniert: die
      # Recovery-Kommandos kommen dann NIE an der Basis an, und der Roboter
      # bleibt in der Sackgasse stehen, statt sich freizufahren.
      #
      # Am 2026-08-22 im Mock gemessen -- /a200_0553/cmd_vel trug beide Typen:
      # controller_server -> TwistStamped, behavior_server -> Twist (3 Publisher,
      # einer je Verhalten).  Kein Test hatte das gefunden: ohne Lidar hat die
      # Costmap keine Hindernisse, also loest nie ein Recovery aus.  Gemeldet
      # hat es Foxglove ("Multiple channels advertise the same topic ... but
      # the schema ... do not match") -- die Warnung war echt, kein Anzeigefehler.
      enable_stamped_cmd_vel: true
      behavior_plugins: ["spin", "backup", "wait"]
      spin:
        plugin: "nav2_behaviors::Spin"
      backup:
        plugin: "nav2_behaviors::BackUp"
      wait:
        plugin: "nav2_behaviors::Wait"
      max_rotational_vel: 0.8
      min_rotational_vel: 0.2
      rotational_acc_lim: 1.0

  map_server:
    ros__parameters:
      yaml_filename: "leerer_raum.yaml"

  amcl:
    ros__parameters:
      # AMCL laeuft erst mit, wenn der Sensorpfad Scans liefert (Task 9).
      # Bis dahin uebernimmt ein static_transform_publisher die Kante
      # map -> odom: ein AMCL ohne Scans publiziert GAR KEINE Transformation,
      # und die TF-Kette staende still.
      base_frame_id: base_link
      odom_frame_id: odom
      global_frame_id: map
      scan_topic: /a200_0553/sensors/lidar3d_0/scan
      robot_model_type: "nav2_amcl::DifferentialMotionModel"
      laser_model_type: "likelihood_field"
      min_particles: 500
      max_particles: 2000
      update_min_d: 0.25
      update_min_a: 0.2
      laser_max_range: 25.0
      laser_min_range: 0.2
      set_initial_pose: true
      initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
