# rslidar_sdk configuration for the RoboSense RS-LiDAR-16 of the a200-0553.
#
# THIS FILE IS THE SHARED SOURCE FOR MOCK AND ROBOT.  It is never handed to
# the node directly -- husky_navigation.rslidar_config.render() produces the
# resolved version from it, and the ONLY difference between container mock
# and real device is common.msg_source.
#
# msg_source is deliberately NOT here: whoever could set the value here could
# also leave it standing at 1 by accident while the mock is running -- the
# driver would then wait silently for UDP packets that never come.
#
# The apt package ros-jazzy-rslidar-sdk 1.5.16 ships NO template
# (measured 2026-08-22: dpkg -x shows only launch/, rviz/ and the binary).
# The key names below come from the strings of that same binary.
common:
  send_packet_ros: false        # nobody needs raw packets -- only the cloud
  send_point_cloud_ros: true
  send_packet_proto: false
  send_point_cloud_proto: false

lidar:
  - driver:
      lidar_type: RS16
      msop_port: 6699           # measurement data
      difop_port: 7788          # device info (calibration, serial number)
      start_angle: 0
      end_angle: 360
      min_distance: 0.2         # closer than 20 cm is the sensor itself
      max_distance: 150.0
      use_lidar_clock: false    # without PTP the host clock is the better one
      wait_for_difop: true      # without DIFOP the factory calibration is missing
      dense_points: false
      ts_first_point: false
    ros:
      ros_frame_id: lidar3d_0_laser
      ros_send_point_cloud_topic: /a200_0553/sensors/lidar3d_0/points
