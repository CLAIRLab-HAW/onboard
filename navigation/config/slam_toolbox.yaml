# slam_toolbox (online_async) for the a200-0553.
#
# For MAPPING, not for driving: `nav localization:=slam`.  Afterwards save
# the map and in normal operation drive against it with localization:=amcl:
#   ros2 run nav2_map_server map_saver_cli -f /opt/clair/navigation/maps/labor
a200_0553:
  slam_toolbox:
    ros__parameters:
      solver_plugin: solver_plugins::CeresSolver
      ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
      ceres_preconditioner: SCHUR_JACOBI
      ceres_trust_strategy: LEVENBERG_MARQUARDT
      ceres_dogleg_type: TRADITIONAL_DOGLEG
      ceres_loss_function: None

      odom_frame: odom
      map_frame: map
      base_frame: base_link
      scan_topic: /a200_0553/sensors/lidar3d_0/scan
      mode: mapping

      # The RS16 spins at 10 Hz; processing more often than every 0,2 s
      # brings nothing but load.
      transform_publish_period: 0.02
      map_update_interval: 2.0
      resolution: 0.05
      max_laser_range: 25.0
      minimum_time_interval: 0.2
      transform_timeout: 0.2
      tf_buffer_duration: 30.0
      stack_size_to_use: 40000000

      # The Husky is large and sluggish -- smaller thresholds produced scan
      # matches while standing still, which smear the map.
      minimum_travel_distance: 0.3
      minimum_travel_heading: 0.3
      scan_buffer_size: 10
      use_scan_matching: true
      loop_search_maximum_distance: 3.0
      do_loop_closing: true
