# slam_toolbox (online_async) fuer den a200-0553.
#
# Zum KARTIEREN, nicht zum Fahren: `nav localization:=slam`.  Danach die
# Karte sichern und im Normalbetrieb mit localization:=amcl dagegen fahren:
#   ros2 run nav2_map_server map_saver_cli -f /opt/spact/husky-navigation/maps/labor
a200_0553:
  slam_toolbox:
    ros__parameters:
      solver_plugin: solver_plugins::CeresSolver
      ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
      ceres_preconditioner: SCHUR_JACOBI
      ceres_trust_strategy: LEVENBERG_MARQUARDT
      ceres_dogleg_type: TRADITIONAL_DOGLEG
      ceres_loss_function: None

      odom_frame: odom
      map_frame: map
      base_frame: base_link
      scan_topic: /a200_0553/sensors/lidar3d_0/scan
      mode: mapping

      # Der RS16 dreht mit 10 Hz; oefter als alle 0,2 s zu verarbeiten
      # bringt nichts ausser Last.
      transform_publish_period: 0.02
      map_update_interval: 2.0
      resolution: 0.05
      max_laser_range: 25.0
      minimum_time_interval: 0.2
      transform_timeout: 0.2
      tf_buffer_duration: 30.0
      stack_size_to_use: 40000000

      # Der Husky ist gross und traege -- kleinere Schwellen erzeugten
      # Scan-Matches im Stand, die die Karte verschmieren.
      minimum_travel_distance: 0.3
      minimum_travel_heading: 0.3
      scan_buffer_size: 10
      use_scan_matching: true
      loop_search_maximum_distance: 3.0
      do_loop_closing: true
