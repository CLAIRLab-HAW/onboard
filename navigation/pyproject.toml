[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "husky-navigation"
version = "0.1.0"
description = "Navigation layer of the a200-0553: RoboSense RS16 sensor path and Nav2"
readme = "README.md"
authors = [
    { name = "Hannes Philip Voss", email = "mail@hannesvoss.de" },
]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

# Test-only, hence a group and not `dependencies`: this package runs onboard the robot, where neither the
# contract nor a lock file is wanted.  `robot-contract[testing]` brings `filelock` along -- until 2026-08-24
# the conftest imported it without anyone declaring it anywhere, which worked by transitive accident.
[dependency-groups]
dev = ["robot-contract[testing]"]

[tool.uv.sources]
robot-contract = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
force-exclude = '''
/(
    \.venv
  | \.superpowers
  | \.idea
  | urdf
  | data
  | node_modules
  | [^/]*\.egg-info
)/
'''

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cov"
markers = [
    "nav_e2e: end-to-end against a DRIVING base (mock platform:=true + Nav2); needs a running husky-offboard container, serialised by exclusive_base in conftest",
]
