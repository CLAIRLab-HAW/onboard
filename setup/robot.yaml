manipulators:
  moveit:
    enable: true
    ros_parameters:
      move_group:
        trajectory_execution:
          allowed_goal_duration_margin: 6.0 # allows slow gripper opening/closing
        # Occupancy-Map-Monitor -- der Generator schreibt ros_parameters
        # selbst in moveit.yaml.  octomap_frame bewusst base_link: odom ist
        # hier UTM-gestuetzt und springt.
        octomap_frame: base_link
        octomap_resolution: 0.025
        sensors:
          - wrist_depth_camera
        wrist_depth_camera:
          sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
          point_cloud_topic: /a200_0553/sensors/camera_0/octomap_points
          max_range: 2.0
          point_subsample: 1
          padding_offset: 0.03
          padding_scale: 1.0
          max_update_rate: 5.0
          filtered_cloud_topic: ""
        # Self-Filter-Robustheit (2026-07-29): der Shape-Mask-TF-Lookup zum
        # Cloud-Stempel verpasste die Rad-Frames intermittierend (Default-Wait
        # 0.05 s) -> "Missing transform for shape cylinder", Radpunkte wurden
        # als Hindernis-Voxel eingefuegt und JEDER Plan aus einer Chassis-
        # blickenden Pose scheiterte mit START_STATE_IN_COLLISION. 0.3 s Wait
        # laesst den TF-Puffer aufholen; deep-merged neben cartesian_limits/
        # joint_limits (Generator-Merge empirisch verifiziert).
        robot_description_planning:
          shape_transform_cache_lookup_wait_time: 0.3
          # Beschleunigungslimit des Greifer-Treibergelenks. Ohne das scheitert
          # die TOTG-Zeitparametrierung (AddTimeOptimalParameterization) fuer
          # die gripper-Gruppe. Der Generator deep-merged es hier neben die
          # sechs Arm-Gelenke.
          joint_limits:
            rg6_finger_joint:
              has_velocity_limits: true
              max_velocity: 2.0
              has_acceleration_limits: true
              max_acceleration: 4.0
        # GripperCommand-Controller fuer den OnRobot RG6. Clearpath kennt den
        # RG6 nicht -- Gripper.MODEL ist ein geschlossenes Enum (franka_gripper,
        # kinova_2f_lite, robotiq_2f_140, robotiq_2f_85), ein `gripper:`-Eintrag
        # unter arms wuerde mit ValueError abbrechen. Der Generator schreibt hier
        # aber jeden Boot einen moveit_simple_controller_manager mit dem Arm-
        # Controller, und unser Block wird hineingemerged statt ihn zu ersetzen.
        # Bedient wird die Action am Roboter von rg6_grip_bridge, im Container-
        # Mock von rg6_control_sim (beide unter demselben Namen).
        # ACHTUNG: merge_dict VERLAENGERT Listen, es ersetzt sie nicht. In
        # controller_names darf deshalb NICHT der Arm-Controller stehen, den der
        # Generator selbst schreibt -- er stuende sonst doppelt.
        moveit_simple_controller_manager:
          controller_names:
            - manipulators/rg6_gripper_controller
          manipulators/rg6_gripper_controller:
            action_ns: gripper_cmd
            default: true
            joints:
              - rg6_finger_joint
            type: GripperCommand
            # Greifkraft der MoveIt-Goals [N]; 0 liesse die Bruecke auf ihren
            # eigenen Default zurueckfallen. Wird dort auf 25...120 geklemmt.
            max_effort: 60.0
  arms:
    - model: universal_robots
      parent: top_plate_front_mount
      xyz: [-0.12, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ur_type: ur5
      robot_ip: 192.168.131.40
      headless_mode: true
      kinematics_parameters_file: "/home/robot/ur5_a200_0553_calibration.yaml" # "$(find ur_description)/config/ur5/default_kinematics.yaml"
      # RTDE-Input-Recipe ohne tool_digital_output_mask/tool_digital_output.
      # Die OnRobot-URCap ist selbst RTDE-Client und belegt diese beiden
      # Input-Variablen; RTDE laesst pro Input-Variable nur EINEN schreibenden
      # Client zu. Mit dem Standard-Recipe scheitert der ur_robot_driver beim
      # Setup ("Variable 'tool_digital_output_mask' is currently controlled by
      # another RTDE client"), ros2_control_node stirbt mit exit -6 und alle
      # Controller-Spawner laufen in "Failed to acquire lock".
      # Folge dieser Zeile: ROS kann kein Tool-DO und keine Tool-Spannung mehr
      # setzen -- das Tool-I/O gehoert der URCap, der Arm gehoert ROS. Damit ist
      # der rg6_control-Pfad (Tool-DO0-Flanken) endgueltig ausgeschlossen.
      # Zurueck zum Custom-Treiber: Zeile entfernen UND URCap deaktivieren.
      input_recipe_filename: "/home/robot/rtde_input_recipe_no_tool.txt"
      poses:
        - name: packed
          joints: [-0.000695530568258107, -3.1283000151263636, 2.8355469703674316, -3.193974320088522, 1.5455983877182007, -8.374849428349762e-05]
        - name: forward
          joints: [-0.00532704988588506, -2.2551897207843226, 2.246230125427246, -3.1489999930011194, -1.569127384816305, -0.00013143221010381012]
      ros_parameters:
        controller_manager:
          update_rate: 125 # CB3 RTDE max = 125 Hz; Clearpath-Default 500 -> FATAL
          io_and_status_controller:
            type: ur_controllers/GPIOController
        io_and_status_controller:
          tf_prefix: arm_0_
sensors:
  camera:
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      parent: rg6_onrobot_rg6_base_link
      xyz: [0.023, 0.0, 0.125]
      rpy: [0.0, -1.5708, -3.14]
      ros_parameters:
        intel_realsense:
          camera_name: camera_0
          device_type: d435
          serial_no: "011422072138"
          enable_color: true
          rgb_camera.color_profile: 640,480,30
          enable_depth: true
          # 30 fps setzt ZWEI Dinge voraus (beide erfuellt, Details in
          # docs/hrl-real-perception-plan.md):
          #  1. D435 an USB 3.2 (an USB 2 sind 15 fps das Limit bei 640x480).
          #  2. Robot UND Offboard-Workstation im 5-GHz-Band (HAWAX5): auf dem
          #     2,4-GHz-Band saettigen color@30 + depth@30 (~4,5 MB/s) den
          #     Funkkanal -- gemessen: 8,7/s beim Client + 5,5 s stehender
          #     Lag im foxglove-Sendepuffer. Nach Reboot Band pruefen
          #     (netplan re-rendert HAWAX und HAWAX5 gleichrangig)!
          # Aufloesung bleibt 640x480 (HSV-Detector-Gates darauf getunt).
          depth_module.depth_profile: 640,480,30
          align_depth.enable: true
          pointcloud.enable: true
  gps: []
  imu:
    - model: redshift_um7
      urdf_enabled: true
      launch_enabled: true
      parent: base_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        um7_driver:
          port: /dev/clearpath/um7
          frame_id: imu_0_link
          tf_ned_to_enu: true
