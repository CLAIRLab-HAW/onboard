# CI: the parity guards that read THIS repo, run when THIS repo changes.
#
# This repo has no test suite of its own, and that is not what the workflow is for. It is the single source of
# truth for two files that other repos copy from and check against:
#
#   config/robot.yaml                 -> contract/robot-contract/tests/test_ssot_parity.py     (arm poses)
#   scripts/rg6_finger_kinematics.json -> contract/robot-contract/tests/test_gripper_linkage.py (linkage table)
#                                      -> robot/onrobot-rg6/tests/test_linkage_parity.py       (generated C++ header)
#
# Both guards live in the OTHER repos, so until now they only ever fired when one of those repos was touched --
# a change to robot.yaml or the linkage table here went unnoticed until someone happened to edit the far side.
# The direction that matters most is exactly the one that was missing. Measured 2026-08-29 in a bare 3.11 venv:
# 60 + 15 = 75 tests, 1.7 s, no ROS, no robot.
#
# Nothing here is imported by those tests -- they read the two files as data -- so the scripts get a syntax pass
# instead: ruff for Python (importing them needs rclpy, which no runner has) and `bash -n` for the shell.
#
# No `black --check`: without `--config` pointing at the workspace root pyproject.toml Black takes its own default
# of 88 instead of the workspace's line-length 120 and reports the whole tree unformatted (same reason the
# pre-commit hook passes --config explicitly). This repo carries no pyproject.toml on purpose -- uv would take it
# for the workspace root and run against the system interpreter.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      # The paths mirror the workspace layout (workspace.repos): both suites resolve this repo relative to the
      # workspace root, so a checkout anywhere else would not find it.
      - uses: actions/checkout@v5
        with:
          path: robot/husky-custom-setup

      # CLAIRLAB_READ_TOKEN, not GITHUB_TOKEN: the default token is scoped to the repository the workflow runs in,
      # so against another PRIVATE repo of the same org the API answers "Not Found" rather than 403 -- it does not
      # confirm the repo exists. The org secret is the same one robot-contract, plan-bridge, skill-tree, husky-sdk,
      # onrobot-rg6 and husky-offboard use for their private siblings.
      - uses: actions/checkout@v5
        with:
          repository: CLAIRLab-HAW/onrobot-rg6
          path: robot/onrobot-rg6
          token: ${{ secrets.CLAIRLAB_READ_TOKEN }}
      - uses: actions/checkout@v5
        with:
          repository: CLAIRLab-HAW/robot-contract
          path: contract/robot-contract
          token: ${{ secrets.CLAIRLAB_READ_TOKEN }}

      # Root-finder marker, and here it is load-bearing rather than cosmetic: both suites walk up for
      # workspace.repos and SKIP by name while there is none. Without this line the run would be green having
      # compared nothing, which is the one failure mode this workflow exists to avoid.
      - run: touch workspace.repos

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install pytest numpy pyyaml ruff

      # The scripts import rclpy and the OnRobot XML-RPC endpoint, so they cannot be imported here -- E9/F63/F7/F82
      # are the checks that read the file rather than run it.
      - run: cd robot/husky-custom-setup && ruff check --select E9,F63,F7,F82 .

      - name: bash -n
        working-directory: robot/husky-custom-setup
        run: find . -name '*.sh' -print0 | xargs -0 -n1 bash -n

      # onrobot-rg6 carries no pyproject.toml either, so robot_contract has to be put on the path by hand. Only
      # the linkage-parity file: the rest of that suite compiles the generated C++ header with g++ and is that
      # repo's own business, run by its own workflow.
      - name: linkage table vs. the generated C++ header
        working-directory: robot/onrobot-rg6
        env:
          PYTHONPATH: ${{ github.workspace }}/contract/robot-contract/src
        run: python -m pytest tests/test_linkage_parity.py -q

      - name: robot.yaml and the linkage table vs. the a200_0553 profile
        working-directory: contract/robot-contract
        run: python -m pytest tests/test_ssot_parity.py tests/test_gripper_linkage.py -q
