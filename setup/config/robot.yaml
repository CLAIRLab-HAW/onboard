#  # The device is a RoboSense RS-LiDAR-16, mounted since 2026-08.
#  # NOT ACTIVE YET: parent/xyz/rpy are unmeasured (R33 in ROBOTER-TODO.md).
#  # Uncomment only with real values -- a guessed mounting location produces a
#  # TF that looks plausible and puts the obstacles in the wrong place.  You
#  # cannot see that in the picture.
#  #
#  # WHY 'velodyne_lidar' for a RoboSense device: clearpath_config knows exactly
#  # three lidar3d models -- velodyne_lidar, ouster_os1, seyond_lidar (checked
#  # 2026-08-22 in clearpath_config/sensors/types/lidars_3d.py, lines
#  # 162/247/359) and no robosense.  The entry serves here ONLY as a carrier for
#  # the link and the mesh, so that the mounting pose stands in THIS file (SSOT)
#  # and the frame is canonically called 'lidar3d_0_laser' -- the same name
#  # rslidar_sdk writes into every PointCloud2.
