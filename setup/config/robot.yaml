serial_number: a200-0553
version: 0
system:
  username: robot
  hosts:
    - hostname: cpr-a200-0553
      ip: 192.168.131.10
  ros2:
    namespace: a200_0553
    middleware:
      implementation: rmw_zenoh_cpp # alternative: rmw_fastrtps_cpp
    # Overlay workspaces.  The generator writes them into /etc/clearpath/setup.bash (and, in the offboard
    # container, into /clearpath/setup.bash), so this list is what puts a package on AMENT_PREFIX_PATH for
    # EVERYTHING that follows: the generator's own $(find ...), RViz and the foxglove_bridge resolving
    # package:// meshes, and every helper that sources the chain.
    #
    # TWO of them, and the split is the same one the repos have: onrobot-rg6 describes the COMPONENT (the RG6
    # model, its macro and the measured rg6_v2.yaml), husky-extras describes THIS ROBOT's assembly (sensor
    # arch, ArUco marker, and where the hand is bolted onto the UR5 flange).  platform.extras.urdf.path below
    # names a file from the second, which includes a macro from the first -- so both have to be listed, and a
    # missing husky-extras is not a mesh that fails to draw but a generator run that dies on the include.
    workspaces:
      - /home/robot/onrobot-rg6/install/setup.bash  # rg6_description, rg6_control
      - /home/robot/husky-extras/install/setup.bash # husky_extras_description (the file under extras.urdf below)
platform:
  mcu:
    protocol: proton
  enable_ekf: true
  enable_foxglove_bridge: true
  wireless:
    enable_wireless_watcher: true
  controller: logitech
  extras:
    urdf:
      # The SOURCE tree, not the install space: the generator reads this file as a path and expands it, while the
      # package:// meshes inside it resolve through the workspaces above.  Both halves of the pair have to move
      # together when this path does.
      path: /home/robot/husky-extras/src/husky_extras_description/urdf/clearpath_extras.urdf.xacro
    ros_parameters:
      joy_node:
        dev: /dev/input/js0 # needed due to custom BT receiver
      controller_manager:
        update_rate: 10 # mcu is slow so we give more time
        # cycle_time_error_threshold: 0.1
      # Asset allowlist of the foxglove_bridge.
      #
      # WHY THIS HAS TO STAND HERE AT ALL: the foxglove_bridge ships a correct
      # default (measured at the node: '^package://(?:[-\w%]+/)*
      # [-\w%.]+\.(...)$'). It just never comes into play -- Clearpath's
      # template clearpath_diagnostics/config/foxglove_bridge.yaml SETS the
      # parameter, and a set parameter hides the node default. The generator
      # writes it mangled while doing so (see below), so without this block the
      # generated file carries an allowlist that matches NOTHING -- not even
      # package://. Leaving it out would only work if the key were not generated
      # at all; but ros_parameters can only override, not delete. So this block
      # restores what would hold anyway without the writer bug.
      #
      # ATTENTION, THE REASON FOR THE UNUSUAL SPELLING: NO backslash may appear
      # here. The generator's ParamWriter writes scalars correctly in single
      # quotes, but LISTS through Python's repr -- and that doubles every
      # backslash. YAML single quotes then read it back literally, '\w' becomes
      # backslash-backslash-w, and the regex matches NOTHING any more. Measured:
      # with \w the generated file is broken, patched or not.
      #
      # Hence the backslash-free, exactly equivalent version:
      #   \w -> [A-Za-z0-9_]   (in std::regex/ECMAScript exactly what \w is)
      #   \. -> [.]            (inside a character class, . is literal)
      # foxglove_bridge keeps the patterns as std::vector<std::regex> and
      # compares with std::regex_match (utils.hpp, isWhitelisted) -- against that
      # engine both versions agree on a corpus of matches and non-matches,
      # including non-ASCII.
      #
      # The value deliberately mirrors Clearpath's template, not the node
      # default. The only difference would be a dot in the filename stem -- of
      # 409 meshes under /opt/ros/jazzy/share, none has one.
      foxglove_bridge:
        asset_uri_allowlist:
          - '^package://(?:[-A-Za-z0-9_%]+/)*[-A-Za-z0-9_%]+[.](?:dae|fbx|glb|gltf|jpeg|jpg|mtl|obj|png|stl|tif|tiff|urdf|webp|xacro)$'
      # Analyzer group "Manipulator" for the diagnostic_aggregator. The
      # Clearpath generator only knows platform and sensor analyzers; without
      # this block the statuses of the manipulator_diagnostics node land in the
      # catch-all and do not appear in Cockpit as their own group; the generator
      # flattens the nesting onto the dotted keys ROS expects by itself.
      #
      # The block stands here unconditionally: if the diagnostics node does not
      # run, Cockpit shows the group as STALE instead of letting it vanish. That
      # is the more visible state; to undo it, remove this block.
      diagnostic_aggregator:
        manipulator:
          type: diagnostic_aggregator/AnalyzerGroup
          path: Manipulator
          analyzers:
            arm:
              type: diagnostic_aggregator/GenericAnalyzer
              path: Arm
              startswith: ['manipulator_diagnostics: Arm']
              # 'expected' matters: if a status is missing (node dead), the
              # aggregator produces a STALE entry for it instead of letting it
              # vanish silently.
              expected:
                - 'manipulator_diagnostics: Arm Mode'
                - 'manipulator_diagnostics: Arm Control'
                - 'manipulator_diagnostics: Arm Joints'
                - 'manipulator_diagnostics: Arm Controllers'
            gripper:
              type: diagnostic_aggregator/GenericAnalyzer
              path: Gripper
              startswith: ['manipulator_diagnostics: Gripper']
              expected: ['manipulator_diagnostics: Gripper']
  battery:
    model: HE2411
    configuration: S1P4
  drivetrain:
    control: diff_4wd
    wheels:
      front: indoor
      rear: indoor
  attachments:
    - name: front_bumper
      type: a200.bumper
      model: default
      parent: front_bumper_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      enabled: true
      extension: 0.0
    - name: rear_bumper
      type: a200.bumper
      model: default
      parent: rear_bumper_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      enabled: true
      extension: 0.0
    - name: top_plate
      type: a200.top_plate
      model: large
      parent: default_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      enabled: true
