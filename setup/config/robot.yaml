manipulators:
  moveit:
    enable: true
    ros_parameters:
      move_group:
        trajectory_execution:
          allowed_goal_duration_margin: 6.0 # allows slow gripper opening/closing
        # Occupancy map monitor -- the generator writes ros_parameters into
        # moveit.yaml itself.  octomap_frame is deliberately base_link: odom is
        # UTM-backed here and jumps.
        octomap_frame: base_link
        octomap_resolution: 0.025
        sensors:
          - wrist_depth_camera
        wrist_depth_camera:
          sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
          point_cloud_topic: /a200_0553/sensors/camera_0/octomap_points
          max_range: 2.0
          point_subsample: 1
          padding_offset: 0.03
          padding_scale: 1.0
          max_update_rate: 5.0
          filtered_cloud_topic: ""
        # Self-filter robustness (2026-07-29): the shape mask TF lookup to the
        # cloud stamp intermittently missed the wheel frames (default wait
        # 0.05 s) -> "Missing transform for shape cylinder", wheel points were
        # inserted as obstacle voxels and EVERY plan from a chassis-facing pose
        # failed with START_STATE_IN_COLLISION. A 0.3 s wait lets the TF buffer
        # catch up; deep-merged next to cartesian_limits/joint_limits (the
        # generator merge verified empirically).
        robot_description_planning:
          shape_transform_cache_lookup_wait_time: 0.3
          # Acceleration limit of the gripper driving joint. Without it the
          # TOTG time parameterisation (AddTimeOptimalParameterization) fails for
          # the gripper group. The generator deep-merges it next to the six arm
          # joints here.
          joint_limits:
            rg6_finger_joint:
              has_velocity_limits: true
              max_velocity: 2.0
              has_acceleration_limits: true
              max_acceleration: 4.0
        # GripperCommand controller for the OnRobot RG6. Clearpath does not know
        # the RG6 -- Gripper.MODEL is a closed enum (franka_gripper,
        # kinova_2f_lite, robotiq_2f_140, robotiq_2f_85), and a `gripper:` entry
        # under arms would abort with a ValueError. But the generator writes a
        # moveit_simple_controller_manager with the arm controller here on every
        # boot, and our block is merged into it instead of replacing it.
        # The action is served on the robot by rg6_grip_bridge, in the container
        # mock by rg6_control_sim (both under the same name).
        # ATTENTION: merge_dict EXTENDS lists, it does not replace them. So
        # controller_names must NOT contain the arm controller the generator
        # writes itself -- it would stand there twice.
        moveit_simple_controller_manager:
          controller_names:
            - manipulators/rg6_gripper_controller
          manipulators/rg6_gripper_controller:
            action_ns: gripper_cmd
            default: true
            joints:
              - rg6_finger_joint
            type: GripperCommand
            # Grip force of the MoveIt goals [N]; 0 would let the bridge fall
            # back on its own default. It is clamped to 25...120 there.
            max_effort: 60.0
  arms:
    - model: universal_robots
      parent: top_plate_front_mount
      xyz: [-0.12, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ur_type: ur5
      robot_ip: 192.168.131.40
      headless_mode: true
      kinematics_parameters_file: "/home/robot/ur5_a200_0553_calibration.yaml" # "$(find ur_description)/config/ur5/default_kinematics.yaml"
      # RTDE input recipe without tool_digital_output_mask/tool_digital_output.
      # The OnRobot URCap is an RTDE client itself and occupies these two input
      # variables; RTDE allows only ONE writing client per input variable. With
      # the standard recipe the ur_robot_driver fails during setup ("Variable
      # 'tool_digital_output_mask' is currently controlled by another RTDE
      # client"), ros2_control_node dies with exit -6 and all controller
      # spawners run into "Failed to acquire lock".
      # Consequence of this line: ROS can no longer set a tool DO or the tool
      # voltage -- the tool I/O belongs to the URCap, the arm belongs to ROS.
      # To go back to a tool-DO driver: remove the line AND disable the URCap.
      input_recipe_filename: "/home/robot/rtde_input_recipe_no_tool.txt"
      poses:
        - name: packed
          joints: [-0.000695530568258107, -3.1283000151263636, 2.8355469703674316, -3.193974320088522, 1.5455983877182007, -8.374849428349762e-05]
        - name: forward
          joints: [-0.00532704988588506, -2.2551897207843226, 2.246230125427246, -3.1489999930011194, -1.569127384816305, -0.00013143221010381012]
      ros_parameters:
        controller_manager:
          update_rate: 125 # CB3 RTDE max = 125 Hz; Clearpath-Default 500 -> FATAL
          io_and_status_controller:
            type: ur_controllers/GPIOController
        io_and_status_controller:
          tf_prefix: arm_0_
sensors:
  camera:
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      parent: rg6_onrobot_rg6_base_link
      xyz: [0.023, 0.0, 0.125]
      rpy: [0.0, -1.5708, -3.14]
      ros_parameters:
        intel_realsense:
          camera_name: camera_0
          device_type: d435
          serial_no: "011422072138"
          enable_color: true
          rgb_camera.color_profile: 640,480,30
          enable_depth: true
          # 30 fps requires TWO things (both fulfilled, details in
          # docs/hrl-real-perception-plan.md):
          #  1. the D435 on USB 3.2 (on USB 2, 15 fps is the limit at 640x480).
          #  2. robot AND offboard workstation on the 5 GHz band (HAWAX5): on the
          #     2.4 GHz band color@30 + depth@30 (~4.5 MB/s) saturate the radio
          #     channel -- measured: 8.7/s at the client + 5.5 s of standing lag
          #     in the foxglove send buffer. Check the band after a reboot
          #     (netplan re-renders HAWAX and HAWAX5 with equal priority)!
          # The resolution stays 640x480 (the HSV detector gates are tuned to it).
          depth_module.depth_profile: 640,480,30
          align_depth.enable: true
          pointcloud.enable: true
  gps: []
  imu:
    - model: redshift_um7
      urdf_enabled: true
      launch_enabled: true
      parent: base_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        um7_driver:
          port: /dev/clearpath/um7
          frame_id: imu_0_link
          tf_ned_to_enu: true
